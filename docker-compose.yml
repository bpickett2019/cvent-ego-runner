services:
  steel:
    image: ghcr.io/steel-dev/steel-browser:latest
    container_name: cvent-ego-runner-steel
    restart: unless-stopped
    shm_size: 2gb
    environment:
      CHROME_USER_DATA_DIR: /data/chrome
    ports:
      - "127.0.0.1:3400:3000"
      - "127.0.0.1:9323:9223"
    volumes:
      - ./data/steel-user-data:/data/chrome
